name: Update open-source contributions

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: update-open-source
  cancel-in-progress: false

jobs:
  update-contributions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refresh the public pull-request list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import html
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          username = "DevanshSinghBais"
          profile_repo = f"{username}/DevanshSinghBais"
          query = urllib.parse.quote(
              f"author:{username} type:pr -repo:{profile_repo}"
          )
          url = (
              "https://api.github.com/search/issues"
              f"?q={query}&sort=updated&order=desc&per_page=5"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          lines = []
          for item in data.get("items", []):
              repo = item["repository_url"].rstrip("/").split("/")[-1]
              title = html.escape(item["title"]).replace("[", "\\[").replace("]", "\\]")
              lines.append(f"- **[{repo}]({item['html_url']})** — {title}")
          if not lines:
              lines = ["- No public pull requests found."]

          start_marker = "<!-- OSS_START -->"
          end_marker = "<!-- OSS_END -->"
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          if content.count(start_marker) != 1 or content.count(end_marker) != 1:
              raise SystemExit("README.md must contain one pair of OSS markers")

          start = content.index(start_marker)
          end = content.index(end_marker)
          if end <= start:
              raise SystemExit("OSS_END must follow OSS_START")
          replacement = start_marker + "\n" + "\n".join(lines) + "\n" + end_marker
          readme.write_text(
              content[:start] + replacement + content[end + len(end_marker):],
              encoding="utf-8",
          )
          PY

      - name: Commit README changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "Update open-source contributions"
            git push
          fi
